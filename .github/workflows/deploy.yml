name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Hugo Extended
        run: |
          HUGO_VER="0.147.2"
          echo "Downloading Hugo $HUGO_VER..."
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Debug Environment
        run: |
          echo "PWD: $(pwd)"
          echo "Files:"
          ls -la
          echo "Themes:"
          ls -la themes/
          echo "Theme contents:"
          ls themes/PaperMod/layouts/ 2>&1 || echo "Theme layouts missing!"
          echo "Config:"
          cat config.toml
          echo "---"
          cat .nojekyll

      - name: Build Site
        id: build
        run: |
          echo "=== Starting Hugo build ==="
          hugo --minify --logLevel debug 2>&1 | tee /tmp/hugo-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "Build succeeded"
            ls -la public/
          else
            echo "Build failed with exit code $BUILD_EXIT"
            echo "Last 50 lines of output:"
            tail -50 /tmp/hugo-build.log
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
